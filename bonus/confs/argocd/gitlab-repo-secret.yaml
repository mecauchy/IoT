# =============================================================================
# GITLAB REPOSITORY SECRET FOR ARGO CD
# =============================================================================
# This Secret contains credentials for ArgoCD to access GitLab.
# 
# ArgoCD needs this to:
# 1. Clone the repository containing the Helm chart
# 2. Poll for changes (every 3 minutes by default)
# 3. Authenticate when GitLab repo is private
#
# Security Note: 
# - Use a Personal Access Token (PAT) with minimal permissions
# - Never commit real credentials to Git
# - The values below are PLACEHOLDERS - replace during installation
#
# Token permissions needed:
# - read_repository (clone/pull)
# - write_repository (if ArgoCD needs to push, usually not needed)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: gitlab-repo-creds
  namespace: argocd
  labels:
    # This label tells ArgoCD this is a repository credential
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  # Repository type: git (vs helm repo)
  type: git
  
  # GitLab repository URL
  # Update this to match your GitLab URL
  url: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/iot-app.git
  
  # Authentication credentials
  # PLACEHOLDER VALUES - will be replaced by install script
  username: root
  password: GITLAB_TOKEN_PLACEHOLDER
  
  # For HTTPS with self-signed certs, allow insecure
  insecure: "true"
