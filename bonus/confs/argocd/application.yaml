apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-mcauchy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/mcauchy/inception-of-things.git
    targetRevision: HEAD
    path: bonus/confs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true