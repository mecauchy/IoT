apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-mcauchy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mecauchy/IoT.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOption:
    - CreateNamespace=true