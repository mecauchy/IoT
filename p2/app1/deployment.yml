apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcauchyS
  labels:
    app: nginx
# definition du pod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
# definition du replicaset
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
#  definition du pod